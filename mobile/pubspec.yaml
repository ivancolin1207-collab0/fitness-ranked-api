name: apexmetrix_mobile
description: "Plataforma móvil Android (APK) de entrenamiento adaptativo con Gemini, biometría Fitdays, Health Connect (Whoop/Huawei GT) y Arena Ranked ELO."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.1.0
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_bloc: ^8.1.6
  health: ^11.1.0
  image_picker: ^1.1.2
  fl_chart: ^0.69.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  flutter_blue_plus: ^2.3.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
